version: '3.8'

services:
  ntn-podcast-creator:
    build: 
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: ntn-podcast-creator
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      # Mount audio directories for persistence
      - ../audios/intro_audio:/app/audios/intro_audio
      - ../audios/outro_audio:/app/audios/outro_audio
      - ../audios/background_music:/app/audios/background_music
      # Mount output directory to access generated podcasts
      - ../outputs:/app/outputs
      # Mount uploads directory for uploaded files
      - ../uploads:/app/uploads
      # Directory mount supports atomic settings writes and saved templates.
      # Migrate existing container settings before first enabling this mount.
      - ../core:/app/core
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    restart: unless-stopped
